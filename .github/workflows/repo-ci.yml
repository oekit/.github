name: Repo CI

# 薄调用层：Python 侧门禁规则本体在同仓 .github/workflows/python-ci.yml
# （与各模块仓共用同一份——改一处全 org 生效）。
#   jobs:
#     lint:
#       uses: oekit/.github/.github/workflows/python-ci.yml@main
#
# 本仓自己额外要守的东西只剩一条：sync-projects.py 能跑起来（Smoke）。
# 它的其余检查（Python syntax / Shell syntax / YAML）已由共享本体覆盖，
# 且本体扫的是**全仓库**而非 scripts/——基础模块比脚本更容易被漏
# （脚本在目录里顺理成章，库却常常躺在仓库根）。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    uses: oekit/.github/.github/workflows/python-ci.yml@main
    with:
      python-version: '3.12'

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: sync-projects.py smoke (dry-run help)
        run: |
          python3 scripts/sync-projects.py --help >/dev/null
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/sync-projects.py').read_text())"
      # 看板权威读路径：读 issue 侧 projectItems，不读 projectV2.items 分页
      # （分页滞后 ⇒ 「已入板」被判成「不在板上」= 假阴性，oekit/.github#24）。
      # 自测是变异测试：判据失效必须红，否则这道门禁只是摆设。
      - name: board_query.py smoke + 门禁自测（变异测试：判据失效必须红）
        run: |
          python3 scripts/board_query.py --help >/dev/null
          python3 scripts/board_query.py --selftest

  # 本体/副本 pin 一致性门禁：**只在本仓跑**（别的仓没有 workflow-templates/，
  # 挂进共享 python-ci.yml 会让它们误红）。
  #
  # 为什么需要它：dependabot 的 github-actions ecosystem 只扫 .github/workflows/，
  # 扫不到 workflow-templates/（本体）⇒ 副本被升级而本体陈旧 ⇒
  # sync-project-hooks.sh 下次把陈旧本体回灌到 28 份副本，把升级 revert 掉。
  # 这个回灌发生在手工脚本里，此前**没有任何门禁会报**（2026-10-23 实测）。
  template-pins:
    name: Template pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: 本体不得落后于实际 workflow 的 action pin
        run: python3 scripts/check_template_pins.py
      - name: 门禁自测（变异测试：判据失效必须红）
        run: python3 scripts/check_template_pins.py --selftest
