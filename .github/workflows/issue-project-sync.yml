name: 大盘同步

# org issue / PR / tag ↔ 四块 GitHub Projects 大盘自动对齐。
# Projects v2 不会自动纳入跨仓 issue/PR，也不会跟进 tag——定时补齐。
# 事件触发只覆盖本仓（oekit/.github），跨仓靠下面的轮询。

on:
  schedule:
    # 每小时一次（避开整点，降压）
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      reorder:
        description: '强制重建看板行序（大板子用）：true=无视行数阈值重建，false=按默认'
        type: boolean
        default: false
  # **不**再监听 issues / pull_request：单条入板已由 `issue-to-project.yml`
  # （即时入板）按条目号隔离地做掉了，这里再跑一遍全量是冗余的。
  # 而它有代价：同一个 concurrency group + cancel-in-progress ⇒ 每来一个
  # PR 事件就起一轮同步，**把排队的整点同步取消掉**。
  # 实测 2026-10-26：20 小时里 63 次 PR 事件，把每小时那次整点同步挤到只剩 2 次
  # （整点同步一旦被取消，下次要再等一小时 ⇒ 新 issue/PR 最坏延迟 1 小时以上）。
  # ⇒ 整点同步只保留 schedule + 手动触发，单条入板交给「即时入板」。

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: issue-project-sync
  # **手动触发**（尤其行序重建，40+ 分钟）可以取消同组里在跑的；
  # 而**整点跑不取消**在跑的 —— 它改为排队等待，跑完再跑。
  # 2026-10-26 实测：重建被整点跑掐断过一次（看板停在半空状态），
  # 2026-10-25 实测：重建被「合 PR 触发的同步」掐断过一次。
  # ⇒ 宁可整点跑晚一点，也不要掐断重建。
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync all boards
        env:
          # GITHUB_TOKEN 默认无 project scope，走 PAT / GitHub App token。
          # 所需权限：project（读写）+ read:org
          GH_TOKEN: ${{ secrets.OEKIT_PROJECT_TOKEN }}
          ORG: oekit
          # 手动触发时可要求重建行序；#4 PR 队列 1100+ 行一次重建 ≈4400 次写，
          # 本地跑（跨网延迟 ~2s/次）要两个多小时，CI runner 上 ~15 分钟 ⇒ 走 CI。
          REORDER: ${{ inputs.reorder }}
        run: |
          if [ "$REORDER" = "true" ]; then
            echo "::notice::按手动触发要求重建看板行序"
            python3 scripts/sync-projects.py --apply --reorder
          else
            python3 scripts/sync-projects.py --apply
          fi
