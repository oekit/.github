name: Go CI (shared)

# oekit org 统一 Go CI 门禁（reusable workflow）。
# 各仓库 .github/workflows/ci.yml 只保留一个薄调用层，规则统一在本仓维护：
#   jobs:
#     ci:
#       uses: oekit/.github/.github/workflows/go-ci.yml@main
#       with:
#         go-version: '1.24'
# 规则变更只改本文件，所有引用 @main 的仓库立即生效（激进变更请改用 tag 引用）。

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Go 版本（setup-go 语义，如 1.24 解析为最新 1.24.x）'
        required: false
        type: string
        default: '1.24'
      golangci-lint-version:
        description: 'golangci-lint 版本'
        required: false
        type: string
        default: v2.14.0
      coverage-threshold:
        description: '总覆盖率下限（百分比）；0 = 关闭覆盖率门禁'
        required: false
        type: number
        default: 30
      test-script:
        description: '根模块测试命令；产物含 coverage.out 时自动接覆盖率门禁'
        required: false
        type: string
        default: 'go test -race -count=1 -coverprofile=coverage.out ./...'
      additional-script:
        description: '测试后的附加检查（多行 shell）；嵌套模块默认已自动测试，这里只放特例'
        required: false
        type: string
        default: ''
      test-nested:
        description: '是否自动发现并测试嵌套 go.mod 子模块（build+test -race）'
        required: false
        type: boolean
        default: true
      govulncheck:
        description: '是否运行 govulncheck 漏洞扫描（非阻塞报告；扫描用 CI 工具链，stdlib 修复随补丁版自愈）'
        required: false
        type: boolean
        default: true
      tidy-check:
        description: '是否运行 go mod tidy -diff 门禁（检测 go.mod/go.sum 漂移：指向已删 tag 的版本地板、旧 import 路径、排序不规范等）'
        required: false
        type: boolean
        default: true
      cgo-free-test:
        description: '是否跑免 CGO 档测试（CGO_ENABLED=0）——默认开启；确实需要 CGO 的库显式关闭并写明理由'
        required: false
        type: boolean
        default: true

# 同一 ref 的重复触发取消旧 run（PR 连推 / main 连推不堆叠分钟数）
concurrency:
  group: go-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download deps (retry on transient proxy errors)
        # 见 Test job 里的同名步骤：proxy 偶发 HTTP/2 stream error 会把整条
        # pipeline 标红，而代码无缺陷。先带重试把依赖拉下来，后续步骤走本地缓存。
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5; do
            if out=$(go mod download 2>&1); then
              echo "deps downloaded (attempt $i)"
              if [ -n "$out" ]; then echo "$out"; fi
              ok=1; break
            fi
            # 确定性错误重试无意义——**配置错误不是网络抖动**。
            # 实测 2026-10-22：dependabot 把 go.mod 的 go 指令抬到 1.26.0，
            # 而本仓 CI 钉 1.24（setup-go 设 GOTOOLCHAIN=local）⇒
            # "go: go.mod requires go >= 1.26.0 (running go 1.24.13; GOTOOLCHAIN=local)"。
            # 旧写法会重试 5 次白烧 ~3.5 分钟，且日志里只剩一句
            # "go mod download 连续 5 次失败"，真实原因埋在重试噪声里。
            case "$out" in
              *"requires go >="*)
                echo "::error::go mod download 失败（确定性错误，重试无意义）：$out"
                echo "::error::Go 地板与依赖不匹配：依赖要求的 Go 版本高于本仓 go.mod / CI 声明的地板。"
                echo "::error::矩阵口径见 matrix-tools：基础层钉 1.24、业务层允许 1.24/1.25/1.26、tracing 豁免；"
                echo "::error::且 CI 的 go-version 必须与 go.mod 的 go 指令成对（否则最低支持版本从未被验证）。"
                exit 1 ;;
              *"invalid toolchain"*)
                echo "::error::go mod download 失败（工具链版本写法非法，重试无意义）：$out"
                exit 1 ;;
            esac
            echo "::warning::go mod download 失败（第 $i/5 次）：$out"
            echo "::warning::$((i*15))s 后重试"
            sleep $((i*15))
          done
          [ "$ok" = "1" ] || { echo "::error::go mod download 连续 5 次失败"; exit 1; }

      - name: Check go mod tidy
        if: inputs.tidy-check
        run: |
          set -euo pipefail
          go mod tidy -diff
          # 嵌套子模块各自独立 go.mod，一并做 tidy 门禁
          # 每个子模块用它**自己 go.mod 声明的 go 指令**对应的工具链跑——
          # 否则父仓的 go-version 会替子模块做决定，子模块声明的最低版本从未被验证。
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            [ "$dir" = "." ] && continue
            case "$dir" in
              ./vendor/*|./third_party/*|./testdata/*|./examples/*|./.git/*) continue ;;
            esac
            # GOTOOLCHAIN 只接受**完整工具链版本**（go1.24.0），不接受语言版本
            # （go1.24）——后者会被 go 拒绝：invalid toolchain: go1.24 is a language
            # version but not a toolchain version (go1.24.x)。
            # go 指令写两段（1.24）时补 .0；写三段（1.24.0）直接用。
            tc=$(awk '/^go [0-9]/{print $2; exit}' "$mod")
            case "$tc" in
              *.*.*) : ;;
              *.*)   tc="$tc.0" ;;
              *)     tc="" ;;
            esac
            [ -n "$tc" ] && tc="go$tc" || tc=local
            echo "::group::tidy ${dir#./} (${tc})"
            (cd "$dir" && GOTOOLCHAIN="$tc" go mod tidy -diff)
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path './.git/*' | sort)

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l . | grep -v vendor || true)
          if [ -n "$unformatted" ]; then
            echo "以下文件需要格式化（请运行 make fmt）："
            echo "$unformatted"
            exit 1
          fi

      # 规则本体在本仓 scripts/changelog_check.py（单一事实源；改动即全 org 生效）
      - name: Check out org shared scripts
        uses: actions/checkout@v7
        with:
          repository: oekit/.github
          ref: main
          path: org-ci
          persist-credentials: false

      - name: Check CHANGELOG/tag consistency
        # .github#6：主模块版本节严格递减无重复、[Unreleased] 只允许最顶部一个、
        # tag 检出时必须有同名小节且 [Unreleased] 无正文——消费方做 0.x minor
        # breaking 评估只能靠 CHANGELOG，一致性即对外契约
        run: python3 org-ci/scripts/changelog_check.py

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          args: --timeout 5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download deps (retry on transient proxy errors)
        # 依赖下载偶发撞上 proxy.golang.org 的 HTTP/2 stream error。实测 2026-10-20：
        # oekit/registry 与 oekit/nns 的 main CI 因
        #   "read .../nacos-sdk-go/v2/@v/v2.3.6-....zip:
        #    stream error: stream ID 17; INTERNAL_ERROR; received from peer"
        # 变红——同 commit 重跑即绿，**代码无缺陷**（依赖本身可解析：proxy 上
        # .info/.mod/.zip 均 200）。
        # 但一次网络抖动就把 main 标红 → 红色失去信号价值（误报多了会被忽略，
        # 正是「门禁要少而致命」的反面）。所以在 build/vet 之前先把依赖拉下来
        # 并重试：拉成功后后续步骤走本地 module cache，不再触网。
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5; do
            if out=$(go mod download 2>&1); then
              echo "deps downloaded (attempt $i)"
              if [ -n "$out" ]; then echo "$out"; fi
              ok=1; break
            fi
            # 确定性错误重试无意义——**配置错误不是网络抖动**。
            # 实测 2026-10-22：dependabot 把 go.mod 的 go 指令抬到 1.26.0，
            # 而本仓 CI 钉 1.24（setup-go 设 GOTOOLCHAIN=local）⇒
            # "go: go.mod requires go >= 1.26.0 (running go 1.24.13; GOTOOLCHAIN=local)"。
            # 旧写法会重试 5 次白烧 ~3.5 分钟，且日志里只剩一句
            # "go mod download 连续 5 次失败"，真实原因埋在重试噪声里。
            case "$out" in
              *"requires go >="*)
                echo "::error::go mod download 失败（确定性错误，重试无意义）：$out"
                echo "::error::Go 地板与依赖不匹配：依赖要求的 Go 版本高于本仓 go.mod / CI 声明的地板。"
                echo "::error::矩阵口径见 matrix-tools：基础层钉 1.24、业务层允许 1.24/1.25/1.26、tracing 豁免；"
                echo "::error::且 CI 的 go-version 必须与 go.mod 的 go 指令成对（否则最低支持版本从未被验证）。"
                exit 1 ;;
              *"invalid toolchain"*)
                echo "::error::go mod download 失败（工具链版本写法非法，重试无意义）：$out"
                exit 1 ;;
            esac
            echo "::warning::go mod download 失败（第 $i/5 次）：$out"
            echo "::warning::$((i*15))s 后重试"
            sleep $((i*15))
          done
          [ "$ok" = "1" ] || { echo "::error::go mod download 连续 5 次失败"; exit 1; }

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: ${{ inputs.test-script }}

      # 免 CGO 档：库的测试必须在 CGO_ENABLED=0 下也能跑通。
      #
      # 为什么要有这一档：库的**消费方**（NAS 套件 / 容器镜像 / 静态二进制）
      # 恰恰要求 CGO_ENABLED=0 ⇒ 若库的测试依赖 CGO 驱动，那就是
      # 「**消费方能构建的环境，库自己却不可测**」——而默认档位只在带 CGO 的
      # ubuntu 上跑 ⇒ 这类缺陷对整个矩阵**不可见**。
      #
      # 实测实例（oekit/gormx，2026-10-28）：gormx 把 CGO 驱动
      # gorm.io/driver/sqlite（包装 mattn/go-sqlite3）列为直接依赖（生产代码
      # 零使用，只在测试里）⇒ CGO_ENABLED=0 go test ./... 有 98 个用例失败
      # （"go-sqlite3 requires cgo to work. This is a stub"）⇒ CI 全程绿灯。
      #
      # 注意：**不能用 -race**（竞态检测器本身需要 cgo）⇒ 这一档只跑功能测试。
      # 默认开启；确实需要 CGO 的库显式关掉并在仓内写明理由。
      - name: Test without CGO（免 CGO 档）
        if: inputs.cgo-free-test
        run: |
          set -euo pipefail
          echo "::group::CGO_ENABLED=0 go test（根模块）"
          CGO_ENABLED=0 go test -count=1 ./...
          echo "::endgroup::"
          # 嵌套子模块是独立 module ⇒ 根模块的 ./... 覆盖不到 ⇒ 一并跑。
          # 工具链取子模块自己 go.mod 声明的版本（与下面的 nested 步骤同口径）。
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            [ "$dir" = "." ] && continue
            case "$dir" in
              ./vendor/*|./third_party/*|./testdata/*|./examples/*|./.git/*) continue ;;
            esac
            tc=$(awk '/^go [0-9]/{print $2; exit}' "$mod")
            case "$tc" in
              *.*.*) : ;;
              *.*)   tc="$tc.0" ;;
              *)     tc="" ;;
            esac
            [ -n "$tc" ] && tc="go$tc" || tc="local"
            echo "::group::免 CGO ${dir#./} (${tc})"
            (cd "$dir" && GOTOOLCHAIN="$tc" CGO_ENABLED=0 go test -count=1 ./...)
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path './.git/*' | sort)

      - name: Test nested modules
        if: inputs.test-nested
        run: |
          set -euo pipefail
          found=0
          # 每个嵌套模块用它**自己 go.mod 声明的 go 指令**对应的工具链跑
          # （取 minor，与 setup-go 的 '1.24' 语义一致：解析为最新 1.24.x）。
          # 以前所有嵌套模块都用父仓 CI 的 go-version 跑——于是
          # bootstrap/nacos（声明 1.25）、timertask/redis（声明 1.24）都被在 1.26 下测，
          # **子模块声明的最低版本从未被验证过**——那是空头支票。
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            [ "$dir" = "." ] && continue
            case "$dir" in
              ./vendor/*|./third_party/*|./testdata/*|./examples/*|./.git/*) continue ;;
            esac
            found=1
            # GOTOOLCHAIN 只接受**完整工具链版本**（go1.24.0），不接受语言版本
            # （go1.24）——后者会被 go 拒绝：invalid toolchain: go1.24 is a language
            # version but not a toolchain version (go1.24.x)。
            # go 指令写两段（1.24）时补 .0；写三段（1.24.0）直接用。
            tc=$(awk '/^go [0-9]/{print $2; exit}' "$mod")
            case "$tc" in
              *.*.*) : ;;
              *.*)   tc="$tc.0" ;;
              *)     tc="" ;;
            esac
            [ -n "$tc" ] && tc="go$tc" || tc=local
            echo "::group::nested module ${dir#./} (${tc})"
            # 嵌套模块的依赖不在父仓的 module cache 里，要自己拉——同样带重试
            # （proxy 偶发 HTTP/2 stream error 会让整个 nested 步骤红，而代码无缺陷）
            (
              cd "$dir"
              ok=0
              for i in 1 2 3 4 5; do
                if out=$(GOTOOLCHAIN="$tc" go mod download 2>&1); then
                  if [ -n "$out" ]; then echo "$out"; fi
                  ok=1; break
                fi
                # 同上：地板/工具链不匹配是确定性错误，重试无意义
                case "$out" in
                  *"requires go >="*)
                    echo "::error::nested $dir 依赖下载失败（确定性错误，重试无意义）：$out"
                    echo "::error::嵌套模块声明的 go 版本与依赖要求不匹配——检查 $mod 的 go 指令与依赖的最低 Go 版本。"
                    exit 1 ;;
                  *"invalid toolchain"*)
                    echo "::error::nested $dir 依赖下载失败（工具链版本写法非法，重试无意义）：$out"
                    exit 1 ;;
                esac
                echo "::warning::nested $dir 依赖下载失败（第 $i/5 次）：$out"
                echo "::warning::$((i*15))s 后重试"
                sleep $((i*15))
              done
              [ "$ok" = "1" ] || { echo "::error::nested $dir 依赖连续 5 次拉取失败"; exit 1; }
              GOTOOLCHAIN="$tc" go build ./... && GOTOOLCHAIN="$tc" go test -race -count=1 ./...
            )
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path './.git/*' | sort)
          if [ "$found" -eq 0 ]; then
            echo "无嵌套子模块，跳过"
          fi

      - name: Run additional checks
        if: inputs.additional-script != ''
        run: ${{ inputs.additional-script }}

      - name: govulncheck
        if: inputs.govulncheck
        # 非阻塞报告：发现漏洞亮黄注解但不挡合并（1.24/1.25 pin 的仓 stdlib 漏洞无 backport，阻塞会常红）
        continue-on-error: true
        run: |
          set -o pipefail
          # 扫描工具**不是**被扫模块的一部分——它自己的 go 要求可能高于本仓地板
          # （x/vuln v1.9.0 要求 go>=1.26，而本仓 CI 可能是 1.24）。setup-go 设的
          # GOTOOLCHAIN=local 会让这一步**直接失败**，而 continue-on-error 把它吞掉 →
          # **漏洞扫描静默跳过**，CI 摘要里看起来像「扫过、没漏洞」。
          # 修法：给扫描用「至少本仓版本 + 允许自动升级」的工具链
          # （实测 go1.24.0+auto 可跑通 go1.26 的 x/vuln；go1.24.0 则报 invalid toolchain）。
          # 注意：构建/测试步骤仍用 setup-go 的工具链 + GOTOOLCHAIN=local，
          # 「最低支持版本才真被验证」这条不受影响——这里只放宽扫描工具。
          scan_tc=$(awk '/^go [0-9]/{print $2; exit}' go.mod)
          case "$scan_tc" in
            *.*.*) : ;;
            *.*)   scan_tc="$scan_tc.0" ;;
            *)     scan_tc="" ;;
          esac
          [ -n "$scan_tc" ] && scan_tc="go${scan_tc}+auto" || scan_tc=auto
          GOTOOLCHAIN="$scan_tc" go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... 2>&1 | tee govulncheck.txt
          if grep -q "requires go >=" govulncheck.txt; then
            echo "::warning::govulncheck **未能运行**（扫描工具要求的 Go 版本高于本仓 CI 工具链且无法自动切换）——本次**没有做漏洞扫描**，不要当成「无漏洞」"
          fi
          {
            echo "## govulncheck"
            echo '```'
            tail -n 40 govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check coverage threshold
        if: inputs.coverage-threshold > 0 && hashFiles('coverage.out') != ''
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          THRESHOLD=${{ inputs.coverage-threshold }}
          echo "Total coverage: ${COVERAGE}% (threshold ${THRESHOLD}%)"
          {
            echo "## Coverage"
            echo ""
            echo "| 指标 | 值 |"
            echo "|---|---|"
            echo "| 总覆盖率 | ${COVERAGE}% |"
            echo "| 门禁阈值 | ${THRESHOLD}% |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$COVERAGE" ]; then
            echo "无法解析覆盖率数值"
            exit 1
          fi
          if awk -v c="$COVERAGE" -v t="$THRESHOLD" 'BEGIN { exit !(c < t) }'; then
            echo "覆盖率 ${COVERAGE}% 低于阈值 ${THRESHOLD}%" >> "$GITHUB_STEP_SUMMARY"
            echo "覆盖率 ${COVERAGE}% 低于阈值 ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload coverage
        if: hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
