name: Run a continuous integration test

# 薄调用层：规则本体在 oekit/.github 的 go-ci.yml。
# 新仓用本模板接入后，改 go-version 即可；门禁升级只改共享仓。

on:
  push:
    branches: [ $default-branch ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ $default-branch ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Test
    uses: oekit/.github/.github/workflows/go-ci.yml@main
    with:
      go-version: '1.24'
