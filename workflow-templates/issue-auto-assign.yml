name: Auto-assign new issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  assign:
    name: Assign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Auto-assign maintainers
        uses: actions/github-script@v9
        env:
          # 改成你的维护者 login，逗号分隔可多人
          ASSIGNEES: ${{ github.repository_owner }}
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue || issue.user?.type === 'Bot') return;

            const assignees = (process.env.ASSIGNEES || '')
              .split(',').map(s => s.trim()).filter(Boolean);
            const existing = (issue.assignees || []).map(a => a.login);
            const toAdd = assignees.filter(a => !existing.includes(a));
            if (toAdd.length === 0) return;

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              assignees: toAdd,
            });
